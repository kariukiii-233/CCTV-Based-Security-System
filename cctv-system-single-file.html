<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCTV-Based University Security System</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#0E1318;--panel:#171E25;--panel2:#1D262F;--line:#2B3038;--accent:#5FA648;--accent-dim:#274420;--text:#E7ECEE;--muted:#8A97A3;--alert:#D9614A;--alert-bg:#2A1712;--warn:#D9A441;}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Inter,Arial,sans-serif;font-size:14px}
.hidden{display:none!important}
.mono{font-family:ui-monospace,Consolas,monospace}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;width:100%;padding:10px 12px;border-radius:6px;border:1px solid var(--line);background:#0F151A;color:var(--text);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}
.field{margin-bottom:14px}
.btn{padding:9px 14px;border-radius:6px;border:1px solid var(--accent-dim);background:var(--accent);color:#0E1318;font-weight:600}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
.btn.danger{background:transparent;color:var(--alert);border-color:var(--alert)}
.btn.small{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* login */
#login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;
 background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:36px 36px;background-position:center}
.lwrap{width:100%;max-width:420px}
.lstatus{display:flex;justify-content:space-between;margin-bottom:14px;padding:0 4px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:6px;box-shadow:0 0 6px var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:30px 28px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.card h1{margin:0 0 4px;font-size:18px}
.sub{margin:0 0 24px;font-size:13px;color:var(--muted)}
.pw{position:relative}.pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);font-size:11px}
.err{margin-top:14px;padding:10px 12px;border-radius:6px;background:var(--alert-bg);border:1px solid var(--alert);color:#F0B4A6;font-size:13px}
.hint{margin-top:18px;font-size:11px;color:var(--muted);text-align:center;line-height:1.7}.hint code{color:var(--text)}

/* app */
#app{display:flex;min-height:100%}
aside{width:230px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0}
.brand{padding:18px 18px 14px;font-weight:700;font-size:15px;border-bottom:1px solid var(--line)}
.brand small{display:block;color:var(--muted);font-weight:400;font-size:11px;margin-top:2px}
nav{padding:10px;flex:1}
nav button{display:block;width:100%;text-align:left;padding:10px 12px;margin-bottom:2px;border:0;border-radius:6px;background:none;color:var(--muted)}
nav button:hover{background:var(--panel2);color:var(--text)}
nav button.on{background:var(--accent-dim);color:#fff}
.who{padding:14px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.who b{color:var(--text);display:block;font-size:13px}
main{flex:1;min-width:0;padding:22px 26px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:10px;flex-wrap:wrap}
.top h2{margin:0;font-size:20px}.top p{margin:2px 0 0;color:var(--muted);font-size:13px}
.clock{color:var(--muted);font-size:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:22px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.stat .n{font-size:26px;font-weight:700}.stat .l{color:var(--muted);font-size:12px}
section{margin-bottom:26px}
section>h3,.head-row h3{margin:0 0 10px;font-size:15px}
.head-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.list{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
th{color:var(--muted);font-weight:500;font-size:12px;background:var(--panel2)}
tr:last-child td{border-bottom:0}
.badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11px;border:1px solid var(--line)}
.badge.online,.badge.resolved,.badge.active,.badge.low{color:#8FD27A;border-color:var(--accent-dim)}
.badge.offline,.badge.high,.badge.disabled{color:#F0B4A6;border-color:var(--alert)}
.badge.maintenance,.badge.investigating,.badge.medium{color:var(--warn);border-color:#5a4513}
.badge.open{color:#F0B4A6;border-color:var(--alert)}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.empty{padding:22px;text-align:center;color:var(--muted)}
.cam-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.cam{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer}
.cam:hover{border-color:var(--accent)}
.cam .thumb{height:140px;background:#0a0f12;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;position:relative}
.cam .thumb.live{color:var(--accent)}
.cam .thumb .rec{position:absolute;top:8px;right:10px;color:var(--alert);font-size:11px}
.cam .info{padding:10px 12px;font-size:13px}.cam .info small{color:var(--muted);display:block;margin-top:2px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:18px;z-index:10}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px;width:100%;max-width:560px;max-height:92vh;overflow:auto}
.modal.wide{max-width:720px}
.modal h3{margin:0 0 14px}
.feed{background:#0a0f12;border-radius:6px;aspect-ratio:16/9;overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative}
.feed video,.feed canvas{width:100%;height:100%;object-fit:cover}
.feed .ov{position:absolute;left:10px;top:8px;color:var(--accent);font-size:12px;text-shadow:0 0 4px #000}
.feed .recdot{position:absolute;right:12px;top:8px;color:var(--alert);font-size:12px}
.note{font-size:12px;color:var(--muted);margin:8px 0 12px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--accent);padding:10px 18px;border-radius:6px;z-index:20;font-size:13px}
.toast.bad{border-color:var(--alert);color:#F0B4A6}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:760px){aside{width:100%;position:static}#app{flex-direction:column}nav{display:flex;flex-wrap:wrap;gap:4px}nav button{width:auto}.row2{grid-template-columns:1fr}main{padding:16px}}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login">
  <div class="lwrap">
    <div class="lstatus mono"><span><span class="dot"></span>SECURE CONNECTION</span><span id="lclock">--:--:--</span></div>
    <div class="card">
      <h1>CCTV-Based Security System</h1>
      <p class="sub">Sign in to access the surveillance console.</p>
      <form id="lform" autocomplete="off">
        <div class="field"><label for="lu">Username</label><input id="lu" autofocus></div>
        <div class="field"><label for="lp">Password</label>
          <div class="pw"><input id="lp" type="password"><button type="button" id="lt">SHOW</button></div></div>
        <button class="btn" style="width:100%;padding:12px" type="submit">Log in</button>
        <div class="err hidden" id="lerr" role="alert"></div>
      </form>
      <p class="hint">Administrator: <code>admin / admin123</code><br>Security personnel: <code>security / security123</code></p>
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <aside>
    <div class="brand">CCTV Security<small>Zetech University</small></div>
    <nav id="nav"></nav>
    <div class="who"><b id="whoName"></b><span id="whoRole"></span><br><button class="btn ghost small" id="logout" style="margin-top:10px">Log out</button></div>
  </aside>
  <main>
    <div class="top"><div><h2 id="title"></h2><p id="subtitle"></p></div><div class="clock mono"><span class="dot"></span><span id="clock"></span></div></div>
    <div id="view"></div>
  </main>
</div>

<script>
(function () {
'use strict';
/* =====================================================================
   DATA  - stored in this browser (localStorage) so changes are kept.
   To reset everything: log in as admin > Settings > Reset demo data.
   ===================================================================== */
var KEY = 'cctv_db_v1';
function seed() {
  return {
    users: [
      { id: 1, name: 'System Administrator', username: 'admin',    password: 'admin123',    role: 'admin',    status: 'active' },
      { id: 2, name: 'Security Personnel',   username: 'security', password: 'security123', role: 'operator', status: 'active' }
    ],
    zones: ['Main Gate', 'Library', 'Hostels', 'Parking', 'Admin Block', 'Labs'],
    cameras: [
      { id: 1, code: 'CAM 01', zone: 'Main Gate',   location: 'Main gate entrance',  source: 'webcam', status: 'online' },
      { id: 2, code: 'CAM 02', zone: 'Library',     location: 'Library reading hall', source: '',       status: 'online' },
      { id: 3, code: 'CAM 03', zone: 'Hostels',     location: 'Hostel block A corridor', source: '',    status: 'online' },
      { id: 4, code: 'CAM 04', zone: 'Parking',     location: 'Staff parking lot',    source: '',       status: 'offline' },
      { id: 5, code: 'CAM 05', zone: 'Admin Block', location: 'Admin block lobby',    source: '',       status: 'online' },
      { id: 6, code: 'CAM 06', zone: 'Labs',        location: 'Computer lab 2',       source: '',       status: 'maintenance' }
    ],
    incidents: [
      { id: 1, title: 'Unauthorised entry at hostel gate', camera: 'CAM 03', severity: 'high',   status: 'investigating', desc: 'Person climbed over the fence after 10pm.', by: 'security', at: '2026-10-14 22:10' },
      { id: 2, title: 'Suspicious vehicle in parking',     camera: 'CAM 04', severity: 'medium', status: 'open',          desc: 'Unknown car parked for hours.',            by: 'security', at: '2026-10-15 14:30' },
      { id: 3, title: 'Laptop theft reported in library',  camera: 'CAM 02', severity: 'high',   status: 'resolved',      desc: 'Footage reviewed; suspect identified.',     by: 'admin',    at: '2026-10-12 11:05' }
    ],
    recordings: [
      { id: 1, camera: 'CAM 01', start: '2026-10-16 08:00', end: '2026-10-16 08:45', note: 'Morning rush' },
      { id: 2, camera: 'CAM 02', start: '2026-10-12 10:50', end: '2026-10-12 11:20', note: 'Library incident' }
    ],
    alerts: [
      { id: 1, camera: 'CAM 03', msg: 'Motion detected after hours', at: '2026-10-17 23:12', ack: false },
      { id: 2, camera: 'CAM 04', msg: 'Camera went offline',         at: '2026-10-17 18:40', ack: false }
    ],
    log: [], next: { incidents: 4, recordings: 3, alerts: 3, cameras: 7, users: 3 }
  };
}
var DB;
function load() { try { DB = JSON.parse(localStorage.getItem(KEY)); } catch (e) { DB = null; } if (!DB) DB = seed(); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) {} }
load();

/* ---------- helpers ---------- */
var $ = function (s, el) { return (el || document).querySelector(s); };
function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function stamp() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function roleName(r) { return { admin: 'Administrator', operator: 'Security personnel' }[r] || r; }
function cap(s) { return String(s || '').replace(/^./, function (c) { return c.toUpperCase(); }); }
function logit(a, d) { DB.log.unshift({ at: stamp(), user: ME ? ME.username : '-', action: a, details: d || '' }); DB.log = DB.log.slice(0, 200); save(); }
var toastT;
function toast(m, bad) { var o = $('.toast'); if (o) o.remove(); var t = document.createElement('div'); t.className = 'toast' + (bad ? ' bad' : ''); t.textContent = m; document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(function () { t.remove(); }, 2600); }
function tick() { var t = new Date().toLocaleTimeString('en-GB', { hour12: false }); $('#lclock').textContent = t; $('#clock').textContent = new Date().toLocaleDateString('en-GB') + '  ' + t; }
tick(); setInterval(tick, 1000);

var modalCleanup = null;
function openModal(html, wide) {
  closeModal();
  var bg = document.createElement('div'); bg.className = 'modal-bg'; bg.id = 'mbg';
  bg.innerHTML = '<div class="modal' + (wide ? ' wide' : '') + '">' + html + '</div>';
  bg.addEventListener('mousedown', function (e) { if (e.target === bg) closeModal(); });
  document.body.appendChild(bg); return bg;
}
function closeModal() { if (modalCleanup) { modalCleanup(); modalCleanup = null; } var m = $('#mbg'); if (m) m.remove(); }

/* ---------- login ---------- */
var ME = null, MAX = 5, fails = {};
$('#lt').onclick = function () { var p = $('#lp'), s = p.type === 'password'; p.type = s ? 'text' : 'password'; this.textContent = s ? 'HIDE' : 'SHOW'; };
$('#lform').onsubmit = function (e) {
  e.preventDefault();
  var u = $('#lu').value.trim(), p = $('#lp').value, er = $('#lerr');
  function bad(m) { er.textContent = m; er.classList.remove('hidden'); $('#lu').style.borderColor = $('#lp').style.borderColor = 'var(--alert)'; }
  if (!u || !p) return bad('Enter both a username and password.');
  var user = DB.users.filter(function (x) { return x.username === u; })[0];
  if (user && fails[u] >= MAX) return bad('Too many failed attempts. Reload the page to try again.');
  if (user && user.status === 'disabled') return bad('This account has been disabled. Contact the administrator.');
  if (!user || user.password !== p) { if (user) fails[u] = (fails[u] || 0) + 1; return bad('Invalid username or password.'); }
  ME = user; fails = {}; logit('login', 'Signed in');
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#lp').value = ''; er.classList.add('hidden');
  start();
};
$('#logout').onclick = function () { logit('logout', 'Signed out'); closeModal(); ME = null; $('#app').classList.add('hidden'); $('#login').classList.remove('hidden'); $('#lu').value = ''; };

/* ---------- navigation ---------- */
var PAGES = {}, NAV = [
  { id: 'dashboard',  label: 'Dashboard',       roles: ['admin', 'operator'], sub: 'Overview of your surveillance network' },
  { id: 'monitoring', label: 'Live monitoring', roles: ['admin', 'operator'], sub: 'Click a camera to view its feed' },
  { id: 'incidents',  label: 'Incidents',       roles: ['admin', 'operator'], sub: 'Logged and flagged security events' },
  { id: 'recordings', label: 'Recordings',      roles: ['admin', 'operator'], sub: 'Stored footage and clips' },
  { id: 'cameras',    label: 'Cameras & zones', roles: ['admin'],             sub: 'Add, edit and remove cameras' },
  { id: 'users',      label: 'Users',           roles: ['admin'],             sub: 'Manage who can sign in' },
  { id: 'activity',   label: 'Activity log',    roles: ['admin'],             sub: 'Who did what, and when' },
  { id: 'settings',   label: 'Settings',        roles: ['admin', 'operator'], sub: 'Your password and system data' }
];
var cur = 'dashboard';
function start() {
  $('#whoName').textContent = ME.name; $('#whoRole').textContent = roleName(ME.role);
  var items = NAV.filter(function (n) { return n.roles.indexOf(ME.role) > -1; });
  $('#nav').innerHTML = items.map(function (n) { return '<button data-p="' + n.id + '">' + n.label + '</button>'; }).join('');
  $('#nav').onclick = function (e) { var b = e.target.closest('button'); if (b) go(b.dataset.p); };
  go('dashboard');
}
function go(id) {
  closeModal(); cur = id;
  var n = NAV.filter(function (x) { return x.id === id; })[0];
  if (!n || n.roles.indexOf(ME.role) < 0) { toast('You do not have access to that page.', true); return; }
  $('#title').textContent = n.label; $('#subtitle').textContent = n.sub;
  document.querySelectorAll('#nav button').forEach(function (b) { b.classList.toggle('on', b.dataset.p === id); });
  PAGES[id]();
}
function refresh() { go(cur); }
function table(heads, rows, empty) {
  return '<div class="list"><table><thead><tr>' + heads.map(function (h) { return '<th>' + h + '</th>'; }).join('') + '</tr></thead><tbody>' +
    (rows.length ? rows.join('') : '<tr><td colspan="' + heads.length + '"><div class="empty">' + empty + '</div></td></tr>') + '</tbody></table></div>';
}
function badge(s) { return '<span class="badge ' + esc(s) + '">' + esc(cap(s)) + '</span>'; }
function camByCode(c) { return DB.cameras.filter(function (x) { return x.code === c; })[0]; }

/* ---------- dashboard ---------- */
PAGES.dashboard = function () {
  var on = DB.cameras.filter(function (c) { return c.status === 'online'; }).length;
  var openInc = DB.incidents.filter(function (i) { return i.status !== 'resolved'; }).length;
  var newAl = DB.alerts.filter(function (a) { return !a.ack; }).length;
  $('#view').innerHTML =
    '<div class="stats">' +
    '<div class="stat"><div class="n">' + on + ' / ' + DB.cameras.length + '</div><div class="l">Cameras online</div></div>' +
    '<div class="stat"><div class="n">' + newAl + '</div><div class="l">Unacknowledged alerts</div></div>' +
    '<div class="stat"><div class="n">' + openInc + '</div><div class="l">Open incidents</div></div>' +
    '<div class="stat"><div class="n">' + DB.recordings.length + '</div><div class="l">Saved recordings</div></div></div>' +
    '<section><h3>Alerts</h3>' + table(['Time', 'Camera', 'Message', ''], DB.alerts.map(function (a) {
      return '<tr><td>' + esc(a.at) + '</td><td>' + esc(a.camera) + '</td><td>' + esc(a.msg) + '</td><td>' +
        (a.ack ? badge('resolved').replace('Resolved', 'Acknowledged') : '<button class="btn small" data-ack="' + a.id + '">Acknowledge</button>') + '</td></tr>';
    }), 'No alerts.') + '</section>' +
    '<section><h3>Latest incidents</h3>' + table(['When', 'Incident', 'Camera', 'Severity', 'Status'], DB.incidents.slice(0, 5).map(function (i) {
      return '<tr><td>' + esc(i.at) + '</td><td>' + esc(i.title) + '</td><td>' + esc(i.camera) + '</td><td>' + badge(i.severity) + '</td><td>' + badge(i.status) + '</td></tr>';
    }), 'No incidents logged.') + '</section>';
  $('#view').onclick = function (e) {
    var b = e.target.closest('[data-ack]'); if (!b) return;
    DB.alerts.forEach(function (a) { if (a.id == b.dataset.ack) a.ack = true; });
    logit('alert_ack', 'Alert #' + b.dataset.ack); save(); toast('Alert acknowledged'); refresh();
  };
};

/* ---------- live monitoring + viewer ---------- */
var recorders = {};   // cameraId -> { mr, chunks, started }
PAGES.monitoring = function () {
  $('#view').innerHTML = '<div class="cam-grid">' + (DB.cameras.map(function (c) {
    return '<div class="cam" data-cam="' + c.id + '"><div class="thumb ' + (c.status === 'online' ? 'live' : '') + '">' +
      (c.status === 'online' ? '&#9679; LIVE' : cap(c.status)) + (recorders[c.id] ? '<span class="rec">&#9679; REC</span>' : '') + '</div>' +
      '<div class="info">' + esc(c.code) + ' &middot; ' + esc(c.zone) + '<small>' + esc(c.location) + '</small></div></div>';
  }).join('') || '<div class="empty">No cameras yet.</div>') + '</div>';
  $('#view').onclick = function (e) { var c = e.target.closest('[data-cam]'); if (c) openCamera(+c.dataset.cam); };
};

function openCamera(id) {
  var c = DB.cameras.filter(function (x) { return x.id === id; })[0]; if (!c) return;
  var isLive = c.status === 'online', src = c.source || '';
  var feed;
  if (!isLive) feed = '<div style="color:var(--muted)">Camera is ' + esc(c.status) + '</div>';
  else if (src === 'webcam') feed = '<video id="wv" autoplay muted playsinline></video><span class="ov mono">' + esc(c.code) + '</span>';
  else if (/\.(mp4|webm)(\?|$)/i.test(src)) feed = '<video id="wv" src="' + esc(src) + '" autoplay muted loop controls playsinline></video>';
  else if (/^https?:/i.test(src)) feed = '<img src="' + esc(src) + '" alt="feed" style="width:100%;height:100%;object-fit:cover">';
  else feed = '<canvas id="sim" width="640" height="360"></canvas>';
  var m = openModal(
    '<h3>' + esc(c.code) + ' - ' + esc(c.location) + '</h3><div class="feed">' + feed + '<span class="recdot mono hidden" id="recdot">&#9679; REC</span></div>' +
    '<div class="note">' + (src === 'webcam' ? "Live picture from this computer's camera. Click Allow if the browser asks." : src ? 'Showing the stream set for this camera.' : 'Simulated picture. Set the camera source to "webcam" on the Cameras page for a real feed.') +
    ' Zone: ' + esc(c.zone) + ' &middot; Status: ' + esc(cap(c.status)) + '</div>' +
    '<div class="actions"><button class="btn" id="bRec"' + (isLive ? '' : ' disabled') + '>Start recording</button>' +
    '<button class="btn ghost" id="bSnap"' + (isLive ? '' : ' disabled') + '>Snapshot</button>' +
    '<button class="btn ghost" id="bAl"' + (isLive ? '' : ' disabled') + '>Raise test alert</button>' +
    '<button class="btn ghost" id="bInc">Report incident</button><button class="btn ghost" id="bX">Close</button></div>', true);
  $('#bX', m).onclick = closeModal;

  var wv = $('#wv', m), stream = null, closed = false, cv = $('#sim', m), simT = null, feedEl = $('.feed', m);
  function fail(msg) { feedEl.innerHTML = '<div style="padding:16px;text-align:center;color:var(--muted);font-size:13px">' + esc(msg) + '</div>'; }
  if (wv && src === 'webcam') {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) fail('This browser cannot open the camera. Use Chrome or Edge.');
    else navigator.mediaDevices.getUserMedia({ video: true, audio: false }).then(function (s) {
      if (closed) { s.getTracks().forEach(function (t) { t.stop(); }); return; }
      stream = s; wv.srcObject = s;
    }).catch(function () { fail('Could not open the camera. Click Allow when the browser asks, and make sure no other app is using it.'); });
  }
  if (cv) {
    var g = cv.getContext('2d'), t = 0;
    var draw = function () {
      g.fillStyle = '#0a0f12'; g.fillRect(0, 0, 640, 360);
      for (var i = 0; i < 160; i++) { g.fillStyle = 'rgba(95,166,72,' + (Math.random() * .12) + ')'; g.fillRect(Math.random() * 640, Math.random() * 360, 2 + Math.random() * 18, 1); }
      g.fillStyle = 'rgba(95,166,72,.14)'; g.fillRect(0, (t * 4) % 360, 640, 18);
      g.fillStyle = '#5FA648'; g.font = '14px monospace'; g.fillText(c.code + '  ' + c.location, 16, 26); g.fillText(new Date().toLocaleString('en-GB'), 16, 346);
      if (recorders[c.id]) { g.fillStyle = '#D9614A'; g.beginPath(); g.arc(610, 22, 6, 0, 7); g.fill(); g.fillText('REC', 566, 27); }
      t++;
    };
    draw(); simT = setInterval(draw, 120);
  }
  modalCleanup = function () { closed = true; clearInterval(simT); if (stream) stream.getTracks().forEach(function (t) { t.stop(); }); };

  function recUI() { var r = !!recorders[c.id]; $('#bRec', m).textContent = r ? 'Stop recording' : 'Start recording'; $('#bRec', m).className = 'btn' + (r ? ' danger' : ''); $('#recdot', m).classList.toggle('hidden', !r); }
  recUI();
  $('#bRec', m).onclick = function () {
    var r = recorders[c.id];
    if (!r) {
      var el = wv || cv, can = el && (el.captureStream || el.mozCaptureStream);
      var rec = { started: stamp(), chunks: [], mr: null };
      if (can && window.MediaRecorder) {
        try { rec.mr = new MediaRecorder(el.captureStream ? el.captureStream() : el.mozCaptureStream()); rec.mr.ondataavailable = function (ev) { if (ev.data.size) rec.chunks.push(ev.data); }; rec.mr.start(1000); } catch (e) { rec.mr = null; }
      }
      recorders[c.id] = rec; logit('recording_start', c.code); toast('Recording started'); recUI();
    } else {
      delete recorders[c.id];
      var finish = function (blob) {
        var id = DB.next.recordings++;
        DB.recordings.unshift({ id: id, camera: c.code, start: r.started, end: stamp(), note: blob ? 'Clip saved' : 'Log entry only' });
        save(); logit('recording_stop', c.code);
        if (blob) { var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = c.code.replace(' ', '') + '_' + r.started.replace(/[: ]/g, '-') + '.webm'; document.body.appendChild(a); a.click(); a.remove(); }
        toast(blob ? 'Recording stopped - clip downloaded' : 'Recording stopped and logged');
      };
      if (r.mr && r.mr.state !== 'inactive') { r.mr.onstop = function () { finish(new Blob(r.chunks, { type: 'video/webm' })); }; r.mr.stop(); } else finish(null);
      recUI();
    }
  };
  $('#bSnap', m).onclick = function () {
    var el = wv || cv; if (!el) return toast('Nothing to capture', true);
    var w = el.videoWidth || el.width || 640, h = el.videoHeight || el.height || 360, k = document.createElement('canvas'); k.width = w; k.height = h;
    try { k.getContext('2d').drawImage(el, 0, 0, w, h); var a = document.createElement('a'); a.href = k.toDataURL('image/png'); a.download = c.code.replace(' ', '') + '_snapshot.png'; document.body.appendChild(a); a.click(); a.remove(); logit('snapshot', c.code); toast('Snapshot saved'); } catch (e) { toast('Could not capture this feed', true); }
  };
  $('#bAl', m).onclick = function () { DB.alerts.unshift({ id: DB.next.alerts++, camera: c.code, msg: 'Test motion alert', at: stamp(), ack: false }); save(); logit('alert_test', c.code); toast('Test alert raised'); };
  $('#bInc', m).onclick = function () { incidentForm(c.code); };
}

/* ---------- incidents ---------- */
PAGES.incidents = function () {
  $('#view').innerHTML = '<div class="head-row"><h3>All incidents</h3><button class="btn" id="add">Report incident</button></div>' +
    table(['When', 'Incident', 'Camera', 'Severity', 'Status', 'By', ''], DB.incidents.map(function (i) {
      return '<tr><td>' + esc(i.at) + '</td><td>' + esc(i.title) + '<br><span class="note">' + esc(i.desc) + '</span></td><td>' + esc(i.camera) + '</td><td>' + badge(i.severity) + '</td><td>' + badge(i.status) + '</td><td>' + esc(i.by) + '</td>' +
        '<td><div class="actions"><select data-st="' + i.id + '" style="width:auto;padding:5px"><option value="open"' + (i.status === 'open' ? ' selected' : '') + '>Open</option><option value="investigating"' + (i.status === 'investigating' ? ' selected' : '') + '>Investigating</option><option value="resolved"' + (i.status === 'resolved' ? ' selected' : '') + '>Resolved</option></select>' +
        (ME.role === 'admin' ? '<button class="btn small danger" data-del="' + i.id + '">Delete</button>' : '') + '</div></td></tr>';
    }), 'No incidents logged.');
  $('#add').onclick = function () { incidentForm(''); };
  $('#view').onchange = function (e) { var s = e.target.closest('[data-st]'); if (!s) return; DB.incidents.forEach(function (i) { if (i.id == s.dataset.st) i.status = s.value; }); logit('incident_status', '#' + s.dataset.st + ' -> ' + s.value); save(); toast('Status updated'); refresh(); };
  $('#view').onclick = function (e) { var d = e.target.closest('[data-del]'); if (!d || !confirm('Delete this incident?')) return; DB.incidents = DB.incidents.filter(function (i) { return i.id != d.dataset.del; }); logit('incident_delete', '#' + d.dataset.del); save(); refresh(); };
};
function incidentForm(code) {
  var m = openModal('<h3>Report incident</h3>' +
    '<div class="field"><label>Title</label><input id="f1"></div>' +
    '<div class="row2"><div class="field"><label>Camera</label><select id="f2">' + DB.cameras.map(function (c) { return '<option' + (c.code === code ? ' selected' : '') + '>' + esc(c.code) + '</option>'; }).join('') + '</select></div>' +
    '<div class="field"><label>Severity</label><select id="f3"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select></div></div>' +
    '<div class="field"><label>Description</label><textarea id="f4" rows="3"></textarea></div>' +
    '<div class="actions"><button class="btn" id="ok">Save incident</button><button class="btn ghost" id="no">Cancel</button></div>');
  $('#no', m).onclick = function () { closeModal(); if (cur === 'monitoring') {} };
  $('#ok', m).onclick = function () {
    var t = $('#f1', m).value.trim(); if (!t) return toast('Give the incident a title.', true);
    DB.incidents.unshift({ id: DB.next.incidents++, title: t, camera: $('#f2', m).value, severity: $('#f3', m).value, status: 'open', desc: $('#f4', m).value.trim(), by: ME.username, at: stamp() });
    logit('incident_add', t); save(); closeModal(); toast('Incident saved'); if (cur === 'incidents' || cur === 'dashboard') refresh();
  };
}

/* ---------- recordings ---------- */
PAGES.recordings = function () {
  $('#view').innerHTML = '<p class="note">Open a camera under Live monitoring and click Start recording. When you stop, the video clip downloads to your computer and a record is listed here.</p>' +
    table(['Camera', 'Started', 'Ended', 'Note', ''], DB.recordings.map(function (r) {
      return '<tr><td>' + esc(r.camera) + '</td><td>' + esc(r.start) + '</td><td>' + esc(r.end) + '</td><td>' + esc(r.note) + '</td><td>' + (ME.role === 'admin' ? '<button class="btn small danger" data-del="' + r.id + '">Delete</button>' : '') + '</td></tr>';
    }), 'No recordings yet.');
  $('#view').onclick = function (e) { var d = e.target.closest('[data-del]'); if (!d || !confirm('Delete this recording record?')) return; DB.recordings = DB.recordings.filter(function (r) { return r.id != d.dataset.del; }); logit('recording_delete', '#' + d.dataset.del); save(); refresh(); };
};

/* ---------- cameras & zones (admin) ---------- */
PAGES.cameras = function () {
  $('#view').innerHTML = '<section><div class="head-row"><h3>Cameras</h3><button class="btn" id="addCam">Add camera</button></div>' +
    table(['Code', 'Zone', 'Location', 'Source', 'Status', ''], DB.cameras.map(function (c) {
      return '<tr><td>' + esc(c.code) + '</td><td>' + esc(c.zone) + '</td><td>' + esc(c.location) + '</td><td>' + esc(c.source || 'simulated') + '</td><td>' + badge(c.status) + '</td>' +
        '<td><div class="actions"><button class="btn small ghost" data-ed="' + c.id + '">Edit</button><button class="btn small danger" data-del="' + c.id + '">Delete</button></div></td></tr>';
    }), 'No cameras.') + '</section>' +
    '<section><div class="head-row"><h3>Zones</h3><button class="btn ghost" id="addZone">Add zone</button></div><div class="list"><table><tbody>' +
    DB.zones.map(function (z) { return '<tr><td>' + esc(z) + '</td><td style="text-align:right"><button class="btn small danger" data-zdel="' + esc(z) + '">Delete</button></td></tr>'; }).join('') + '</tbody></table></div></section>';
  $('#addCam').onclick = function () { camForm(null); };
  $('#addZone').onclick = function () { var z = (prompt('New zone name') || '').trim(); if (z && DB.zones.indexOf(z) < 0) { DB.zones.push(z); save(); refresh(); } };
  $('#view').onclick = function (e) {
    var b;
    if ((b = e.target.closest('[data-ed]'))) camForm(+b.dataset.ed);
    else if ((b = e.target.closest('[data-del]'))) { if (confirm('Delete this camera?')) { DB.cameras = DB.cameras.filter(function (c) { return c.id != b.dataset.del; }); logit('camera_delete', '#' + b.dataset.del); save(); refresh(); } }
    else if ((b = e.target.closest('[data-zdel]'))) { var z = b.dataset.zdel; if (DB.cameras.some(function (c) { return c.zone === z; })) return toast('Move that zone\'s cameras first.', true); DB.zones = DB.zones.filter(function (x) { return x !== z; }); save(); refresh(); }
  };
};
function camForm(id) {
  var c = id ? DB.cameras.filter(function (x) { return x.id === id; })[0] : { code: '', zone: DB.zones[0], location: '', source: '', status: 'online' };
  var m = openModal('<h3>' + (id ? 'Edit' : 'Add') + ' camera</h3>' +
    '<div class="row2"><div class="field"><label>Code</label><input id="c1" value="' + esc(c.code) + '" placeholder="CAM 07"></div>' +
    '<div class="field"><label>Zone</label><select id="c2">' + DB.zones.map(function (z) { return '<option' + (z === c.zone ? ' selected' : '') + '>' + esc(z) + '</option>'; }).join('') + '</select></div></div>' +
    '<div class="field"><label>Location</label><input id="c3" value="' + esc(c.location) + '"></div>' +
    '<div class="field"><label>Source (optional)</label><input id="c4" value="' + esc(c.source) + '" placeholder="webcam   or   http://...   or   clip.mp4"></div>' +
    '<p class="note">webcam = this computer\'s camera. http://... = an IP camera / phone app stream. Empty = simulated picture.</p>' +
    '<div class="field"><label>Status</label><select id="c5">' + ['online', 'offline', 'maintenance'].map(function (s) { return '<option value="' + s + '"' + (s === c.status ? ' selected' : '') + '>' + cap(s) + '</option>'; }).join('') + '</select></div>' +
    '<div class="actions"><button class="btn" id="ok">Save</button><button class="btn ghost" id="no">Cancel</button></div>');
  $('#no', m).onclick = closeModal;
  $('#ok', m).onclick = function () {
    var code = $('#c1', m).value.trim(), loc = $('#c3', m).value.trim(), src = $('#c4', m).value.trim();
    if (!code || !loc) return toast('Code and location are required.', true);
    if (src && src.toLowerCase() !== 'webcam' && !/^https?:\/\//i.test(src) && !/\.(mp4|webm)$/i.test(src)) return toast('Source must be webcam, http://..., or a .mp4/.webm file.', true);
    if (DB.cameras.some(function (x) { return x.code === code && x.id !== id; })) return toast('That camera code is already used.', true);
    if (src.toLowerCase() === 'webcam') src = 'webcam';
    var o = { code: code, zone: $('#c2', m).value, location: loc, source: src, status: $('#c5', m).value };
    if (id) { Object.assign(c, o); } else { o.id = DB.next.cameras++; DB.cameras.push(o); }
    logit(id ? 'camera_edit' : 'camera_add', code); save(); closeModal(); toast('Camera saved'); refresh();
  };
}

/* ---------- users (admin) ---------- */
PAGES.users = function () {
  $('#view').innerHTML = '<div class="head-row"><h3>Accounts</h3><button class="btn" id="addU">Add user</button></div>' +
    table(['Name', 'Username', 'Role', 'Status', ''], DB.users.map(function (u) {
      var self = u.id === ME.id;
      return '<tr><td>' + esc(u.name) + '</td><td>' + esc(u.username) + '</td><td>' + esc(roleName(u.role)) + '</td><td>' + badge(u.status) + '</td><td><div class="actions">' +
        '<button class="btn small ghost" data-rs="' + u.id + '">Reset password</button>' +
        (self ? '' : '<button class="btn small ghost" data-tg="' + u.id + '">' + (u.status === 'active' ? 'Disable' : 'Enable') + '</button><button class="btn small danger" data-del="' + u.id + '">Delete</button>') + '</div></td></tr>';
    }), 'No users.');
  $('#addU').onclick = function () {
    var m = openModal('<h3>Add user</h3><div class="field"><label>Full name</label><input id="u1"></div><div class="row2"><div class="field"><label>Username</label><input id="u2"></div>' +
      '<div class="field"><label>Role</label><select id="u3"><option value="operator">Security personnel</option><option value="admin">Administrator</option></select></div></div>' +
      '<div class="field"><label>Password (min 6 characters)</label><input id="u4" type="text"></div><div class="actions"><button class="btn" id="ok">Create</button><button class="btn ghost" id="no">Cancel</button></div>');
    $('#no', m).onclick = closeModal;
    $('#ok', m).onclick = function () {
      var n = $('#u1', m).value.trim(), un = $('#u2', m).value.trim(), pw = $('#u4', m).value;
      if (!n || !un) return toast('Name and username are required.', true);
      if (pw.length < 6) return toast('Password must be at least 6 characters.', true);
      if (DB.users.some(function (x) { return x.username === un; })) return toast('That username is taken.', true);
      DB.users.push({ id: DB.next.users++, name: n, username: un, password: pw, role: $('#u3', m).value, status: 'active' });
      logit('user_add', un); save(); closeModal(); toast('User created'); refresh();
    };
  };
  $('#view').onclick = function (e) {
    var b;
    if ((b = e.target.closest('[data-rs]'))) { var pw = prompt('New password (min 6 characters)'); if (pw && pw.length >= 6) { DB.users.forEach(function (u) { if (u.id == b.dataset.rs) u.password = pw; }); logit('password_reset', '#' + b.dataset.rs); save(); toast('Password changed'); } else if (pw) toast('Too short.', true); }
    else if ((b = e.target.closest('[data-tg]'))) { DB.users.forEach(function (u) { if (u.id == b.dataset.tg) u.status = u.status === 'active' ? 'disabled' : 'active'; }); save(); refresh(); }
    else if ((b = e.target.closest('[data-del]'))) { if (confirm('Delete this user?')) { DB.users = DB.users.filter(function (u) { return u.id != b.dataset.del; }); logit('user_delete', '#' + b.dataset.del); save(); refresh(); } }
  };
};

/* ---------- activity ---------- */
PAGES.activity = function () {
  $('#view').innerHTML = table(['Time', 'User', 'Action', 'Details'], DB.log.map(function (l) { return '<tr><td>' + esc(l.at) + '</td><td>' + esc(l.user) + '</td><td>' + esc(l.action) + '</td><td>' + esc(l.details) + '</td></tr>'; }), 'Nothing logged yet.');
};

/* ---------- settings ---------- */
PAGES.settings = function () {
  $('#view').innerHTML = '<section style="max-width:420px"><h3>Change my password</h3>' +
    '<div class="field"><label>Current password</label><input id="p1" type="password"></div><div class="field"><label>New password (min 6)</label><input id="p2" type="password"></div>' +
    '<button class="btn" id="chg">Change password</button></section>' +
    (ME.role === 'admin' ? '<section><h3>System data</h3><p class="note">Everything is stored in this browser. Resetting restores the sample cameras, incidents and the two default accounts.</p><button class="btn danger" id="reset">Reset demo data</button></section>' : '');
  $('#chg').onclick = function () {
    var a = $('#p1').value, b = $('#p2').value;
    if (a !== ME.password) return toast('Current password is wrong.', true);
    if (b.length < 6) return toast('New password must be at least 6 characters.', true);
    ME.password = b; logit('password_change', ''); save(); $('#p1').value = $('#p2').value = ''; toast('Password changed');
  };
  var r = $('#reset');
  if (r) r.onclick = function () { if (!confirm('Reset all data? You will be signed out.')) return; localStorage.removeItem(KEY); location.reload(); };
};
})();
</script>
